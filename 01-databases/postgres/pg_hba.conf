# TYPE     DATABASE  USER  ADDRESS           METHOD
# Unix-socket connections used internally by the server/init scripts.
local      all       all                     trust

# Encrypted (TLS) connections from the local machine and from the
# docker-compose bridge network only. Everything else is rejected below.
hostssl    all       all   127.0.0.1/32      scram-sha-256
hostssl    all       all   172.16.0.0/12     scram-sha-256

# Explicitly reject any non-TLS network connection and any other source.
host       all       all   0.0.0.0/0         reject
