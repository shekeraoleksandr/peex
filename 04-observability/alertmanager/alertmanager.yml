route:
  receiver: webhook-logger
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 3h

receivers:
  - name: webhook-logger
    webhook_configs:
      # A firing alert triggers this automated process (see webhook/sink.py),
      # which records the alert to /data/alerts.log inside the sink container.
      - url: 'http://webhook-sink:8080/'
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ['instance']
