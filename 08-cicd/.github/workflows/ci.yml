name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline (lint / test / build / deploy / verify)
        run: bash pipeline/run-local.sh

      - name: Upload build artifacts & reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
