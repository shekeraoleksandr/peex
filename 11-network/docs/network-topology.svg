<text x="1120" y="572" font-size="10" text-anchor="middle" fill="#33475B">IPsec IKEv2 · AES-256/SHA-256</text>
<text x="1120" y="585" font-size="10" text-anchor="middle" fill="#33475B">transport mode — payload encrypted (ESP)</text>
