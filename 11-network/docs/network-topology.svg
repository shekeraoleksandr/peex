<rect x="1010" y="620" width="520" height="250" rx="8" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
<text x="1024" y="644" font-size="13.5" font-weight="700" fill="#1A2B3C">How to read this</text>
<rect x="1024" y="658" width="26" height="16" rx="3" fill="#E9F5EC" stroke="#3E7D52" stroke-width="1.5"/>
<text x="1060" y="670" font-size="11" fill="#33475B">public subnet — route table sends 0.0.0.0/0 to the Internet Gateway</text>
