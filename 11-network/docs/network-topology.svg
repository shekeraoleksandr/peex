</defs>
<rect width="1600" height="1040" fill="#FBFCFD"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#1A2B3C">PeEx · 11-network — VPC topology, routing, filtering and secure connectivity</text>
<rect x="40" y="180" width="920" height="700" rx="8" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2"/>
<text x="52" y="202" font-size="13.5" font-weight="700" fill="#1A2B3C">VPC  peex-main</text>
<text x="52" y="219" font-size="10.5" fill="#44546A">CIDR 10.42.0.0/16   ·   region us-east-1</text>
<rect x="70" y="285" width="860" height="215" rx="8" fill="#E9F5EC" stroke="#3E7D52" stroke-width="2"/>
<text x="82" y="307" font-size="13.5" font-weight="700" fill="#1A2B3C">public-a   ·   10.42.1.0/24   ·   AZ a</text>
<text x="82" y="324" font-size="10.5" fill="#44546A">associated with public-rt  →  has a route to the IGW</text>
<rect x="70" y="520" width="860" height="70" rx="8" fill="#F4F4F4" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="7 4"/>
<text x="82" y="542" font-size="13.5" font-weight="700" fill="#1A2B3C">public-b   ·   10.42.2.0/24   ·   AZ b</text>
<text x="82" y="559" font-size="10.5" fill="#44546A">empty on purpose — lets the stack grow to multi-AZ with no re-addressing</text>
<rect x="70" y="610" width="860" height="215" rx="8" fill="#FDF0E6" stroke="#B5713A" stroke-width="2"/>
<text x="82" y="632" font-size="13.5" font-weight="700" fill="#1A2B3C">private-a   ·   10.42.10.0/24   ·   AZ a</text>
<text x="82" y="649" font-size="10.5" fill="#44546A">no route to the IGW, no public IP — private by ROUTING, not by a flag</text>
<rect x="1010" y="180" width="520" height="320" rx="8" fill="#F3EEFC" stroke="#6B4FA8" stroke-width="2"/>
<text x="1022" y="202" font-size="13.5" font-weight="700" fill="#1A2B3C">VPC  peex-peer</text>
<text x="1022" y="219" font-size="10.5" fill="#44546A">CIDR 10.43.0.0/16 — deliberately non-overlapping</text>
<rect x="1040" y="285" width="460" height="175" rx="8" fill="#FDF0E6" stroke="#B5713A" stroke-width="2"/>
<text x="1052" y="307" font-size="13.5" font-weight="700" fill="#1A2B3C">peer-subnet   ·   10.43.1.0/24</text>
<rect x="100" y="60" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
<text x="200.0" y="80" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">Your workstation</text>
<text x="200.0" y="98" font-size="10.5" text-anchor="middle" fill="#44546A">allowed_cidr = your /32</text>
<rect x="430" y="55" width="180" height="78" rx="8" fill="#DCEBFA" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="520.0" y="75" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">Internet</text>
<rect x="420" y="205" width="180" height="46" rx="8" fill="#DCEBFA" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="510.0" y="225" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">Internet Gateway</text>
<rect x="100" y="345" width="190" height="118" rx="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
<text x="195.0" y="365" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">web</text>
<text x="195.0" y="383" font-size="10.5" text-anchor="middle" fill="#44546A">10.42.1.10  + public IP</text>
<text x="195.0" y="398" font-size="10.5" text-anchor="middle" fill="#44546A">nginx :80</text>
<text x="195.0" y="413" font-size="10.5" text-anchor="middle" fill="#44546A">node_exporter :9100</text>
<rect x="310" y="345" width="190" height="118" rx="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
<text x="405.0" y="365" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">monitoring</text>
<text x="405.0" y="383" font-size="10.5" text-anchor="middle" fill="#44546A">10.42.1.193  + public IP</text>
<text x="405.0" y="398" font-size="10.5" text-anchor="middle" fill="#44546A">Prometheus :9090</text>
<text x="405.0" y="413" font-size="10.5" text-anchor="middle" fill="#44546A">Grafana :3000</text>
<rect x="520" y="345" width="190" height="118" rx="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
<text x="615.0" y="365" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">NAT instance</text>
<text x="615.0" y="383" font-size="10.5" text-anchor="middle" fill="#44546A">10.42.1.118</text>
<text x="615.0" y="398" font-size="10.5" text-anchor="middle" fill="#44546A">source_dest_check = false</text>
<text x="615.0" y="413" font-size="10.5" text-anchor="middle" fill="#44546A">ip_forward + MASQUERADE</text>
<rect x="740" y="345" width="170" height="118" rx="3" fill="#FFF8E1" stroke="#A8811A" stroke-width="1.5"/>
<text x="825.0" y="365" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">public-rt</text>
<text x="825.0" y="383" font-size="10.5" text-anchor="middle" fill="#44546A">0.0.0.0/0 → IGW</text>
<text x="825.0" y="398" font-size="10.5" text-anchor="middle" fill="#44546A">10.43.0.0/16 → pcx</text>
<text x="825.0" y="413" font-size="10.5" text-anchor="middle" fill="#44546A">10.42.0.0/16 → local</text>
<rect x="100" y="670" width="190" height="118" rx="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
<text x="195.0" y="690" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">private host</text>
<text x="195.0" y="708" font-size="10.5" text-anchor="middle" fill="#44546A">10.42.10.10</text>
<text x="195.0" y="723" font-size="10.5" text-anchor="middle" fill="#44546A">no public IP at all</text>
<rect x="310" y="670" width="170" height="118" rx="3" fill="#FFF8E1" stroke="#A8811A" stroke-width="1.5"/>
<text x="395.0" y="690" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">private-rt</text>
<text x="395.0" y="708" font-size="10.5" text-anchor="middle" fill="#44546A">0.0.0.0/0 → NAT ENI</text>
<text x="395.0" y="723" font-size="10.5" text-anchor="middle" fill="#44546A">10.43.0.0/16 → pcx</text>
<text x="395.0" y="738" font-size="10.5" text-anchor="middle" fill="#44546A">10.42.0.0/16 → local</text>
<rect x="520" y="670" width="390" height="118" rx="3" fill="#FFFDE7" stroke="#C9A227" stroke-width="1.5"/>
<text x="715.0" y="690" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">NACL — subnet layer, STATELESS</text>
<text x="715.0" y="708" font-size="10.5" text-anchor="middle" fill="#44546A">no 0.0.0.0/0 inbound rule here;</text>
<text x="715.0" y="723" font-size="10.5" text-anchor="middle" fill="#44546A">ephemeral 1024-65535 must be opened</text>
<text x="715.0" y="738" font-size="10.5" text-anchor="middle" fill="#44546A">explicitly or every reply is dropped</text>
<rect x="1070" y="340" width="190" height="105" rx="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
<text x="1165.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">peer host</text>
<text x="1165.0" y="378" font-size="10.5" text-anchor="middle" fill="#44546A">10.43.1.10</text>
<text x="1165.0" y="393" font-size="10.5" text-anchor="middle" fill="#44546A">strongSwan endpoint</text>
<rect x="1290" y="340" width="180" height="105" rx="3" fill="#FFF8E1" stroke="#A8811A" stroke-width="1.5"/>
<text x="1380.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">peer-rt</text>
<text x="1380.0" y="378" font-size="10.5" text-anchor="middle" fill="#44546A">10.42.0.0/16 → pcx</text>
<text x="1380.0" y="393" font-size="10.5" text-anchor="middle" fill="#44546A">10.43.0.0/16 → local</text>
<rect x="100" y="905" width="200" height="80" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
<text x="200.0" y="925" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">VPC Flow Logs</text>
<text x="200.0" y="943" font-size="10.5" text-anchor="middle" fill="#44546A">traffic_type = ALL</text>
<text x="200.0" y="958" font-size="10.5" text-anchor="middle" fill="#44546A">ACCEPT and REJECT</text>
<rect x="350" y="905" width="200" height="80" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
<text x="450.0" y="925" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">CloudWatch Logs</text>
<text x="450.0" y="943" font-size="10.5" text-anchor="middle" fill="#44546A">retention 1 day</text>
<rect x="600" y="905" width="210" height="80" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
<text x="705.0" y="925" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">CloudWatch Alarms</text>
<text x="705.0" y="943" font-size="10.5" text-anchor="middle" fill="#44546A">CPU · StatusCheckFailed</text>
<rect x="860" y="905" width="150" height="80" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
<text x="935.0" y="925" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">SNS topic</text>
<rect x="1060" y="905" width="150" height="80" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
<text x="1135.0" y="925" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1A2B3C">e-mail</text>
<text x="1135.0" y="943" font-size="10.5" text-anchor="middle" fill="#44546A">notification channel</text>
