<rect x="951" y="514" width="217" height="32" rx="3" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="1060" y="527" font-size="10" text-anchor="middle" fill="#33475B">VPC peering — private, never on the</text>
<text x="1060" y="540" font-size="10" text-anchor="middle" fill="#33475B">public internet. Routes on BOTH sides.</text>
<path d="M930,700 L1002,700 L1002,575 L1210,575 L1210,445" fill="none" stroke="#B5514A" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#a_dashed)"/>
