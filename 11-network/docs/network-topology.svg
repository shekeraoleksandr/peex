<text x="520" y="896" font-size="10" text-anchor="middle" fill="#33475B">instance metrics — collected OUTSIDE the box being watched</text>
<path d="M810,945 L860,945" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-dasharray="1.5 5" stroke-linecap="round" marker-end="url(#a_dotted)"/>
